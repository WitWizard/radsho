name: Build All Platforms (Radsho)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: powershell -ExecutionPolicy Bypass -File ./scripts/build-windows.ps1
          - os: ubuntu-22.04
            script: bash ./scripts/build-all.sh desktop
          - os: macos-latest
            script: bash ./scripts/build-all.sh desktop
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Build Desktop Artifacts
        run: ${{ matrix.script }}
      - name: Upload Desktop Installers
        uses: actions/upload-artifact@v4
        with:
          name: radsho-${{ matrix.os }}
          path: dist-installers/*

  build-android:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install NDK
        run: sdkmanager --install "ndk;27.0.12077973"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Build Android APK & AAB
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
        run: bash ./scripts/build-all.sh android
      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: radsho-android
          path: dist-installers/*