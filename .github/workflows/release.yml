name: Build All Platforms (Radsho)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dkotlin.compiler.execution.strategy=in-process"

jobs:
  prepare-release:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout Repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global init.defaultBranch main
          git config --global advice.defaultBranchName false
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Ensure Release Tag Exists
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${GITHUB_SHA}" \
              --title "Radsho ${TAG}" \
              --notes "Radsho (${TAG}) multi-platform release by WitWizard (Lilmmd & LFnighTT)."
          fi

  build-desktop:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-22.04
            platform: linux
          - os: macos-15-intel
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global init.defaultBranch main
          git config --global advice.defaultBranchName false
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Setup Rust Toolchain
        shell: bash
        run: |
          rustup default stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install Linux Dependencies
        if: matrix.platform == 'linux'
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libfuse2 \
            rpm \
            file \
            zip \
            build-essential \
            curl \
            wget
      - name: Build Windows Artifacts
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Build Unix Desktop Artifacts
        if: matrix.platform != 'windows'
        shell: bash
        run: bash ./scripts/build-all.sh desktop
      - name: Publish Desktop Assets to Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          shopt -s nullglob
          FILES=(dist-installers/*)
          if [ "${#FILES[@]}" -gt 0 ]; then
            gh release upload "${RELEASE_TAG}" "${FILES[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
          fi

  build-android:
    needs: prepare-release
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global init.defaultBranch main
          git config --global advice.defaultBranchName false
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
      - name: Configure JDK 17 & Android SDK/NDK
        run: |
          if [ -n "${JAVA_HOME_17_X64:-}" ] && [ -d "${JAVA_HOME_17_X64}" ]; then
            export JAVA_HOME="${JAVA_HOME_17_X64}"
            echo "JAVA_HOME=${JAVA_HOME_17_X64}" >> "$GITHUB_ENV"
            echo "${JAVA_HOME_17_X64}/bin" >> "$GITHUB_PATH"
          fi
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -name sdkmanager -type f | head -n 1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973" >/dev/null
          NDK_PATH="$SDK_ROOT/ndk/27.0.12077973"
          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
      - name: Setup Rust Android Targets
        run: |
          rustup default stable
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build Android APK & AAB Packages
        run: bash ./scripts/build-all.sh android
      - name: Publish Android Assets to Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          shopt -s nullglob
          FILES=(dist-installers/*)
          if [ "${#FILES[@]}" -gt 0 ]; then
            gh release upload "${RELEASE_TAG}" "${FILES[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
          fi